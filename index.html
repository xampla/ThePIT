<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The PIT — multi-agent observability and threat detection</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand" title="The PIT — multi-agent observability and threat detection">
      <img src="/logo.png" alt="">
      <b>The PIT</b>
    </div>

    <span class="source" id="srcStatus" title="Connecting to the collector…">
      <span class="live-dot paused" id="liveDot"></span>
      <span class="fname" id="srcName">collector</span>
      <span class="bytes" id="srcSub">connecting…</span>
    </span>

    <div class="spacer"></div>

    <button class="btn" id="settingsBtn" title="Settings (⌘,)">Settings</button>
    <span class="clock" id="clock">--:--:--</span>
  </header>

  <section class="measures" id="measures"></section>

  <main>
    <!-- LEFT -->
    <div class="col">
      <section class="panel" style="flex:0 0 auto;max-height:52%">
        <div class="phead"><h2>Agents</h2><span class="count" id="agentCount">0</span></div>
        <div class="pbody" id="agentList"></div>
      </section>
      <section class="panel" style="flex:1 1 auto;min-height:0">
        <div class="phead"><h2>Tool calls</h2><span class="count" id="toolCount">0</span></div>
        <div class="pbody" id="toolList" style="padding:6px 0"></div>
      </section>
    </div>

    <!-- CENTER -->
    <div class="col center">
      <section class="panel map">
        <div class="phead">
          <h2>Agent to host activity</h2>
          <span class="count" id="linkCount">0 links</span>
          <div class="spacer"></div>
          <div class="legend">
            <span><i style="background:#8E7CFF"></i>agent</span>
            <span><i style="background:#F2A7FF"></i>sub-agent</span>
            <span><i style="background:#3FD68C"></i>trusted</span>
            <span><i style="background:#FFB020"></i>unverified</span>
            <span><i style="background:#FF5C57"></i>low reputation</span>
          </div>
          <span class="clock" id="mapScope" style="padding-left:12px;margin-left:2px;border-left:1px solid var(--line)">all agents</span>
          <button class="iconbtn" id="mapExpand" title="Open the map in a large view (drag to pan, wheel to zoom, Esc to close)" aria-label="Expand map">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M7 1h4v4M5 11H1V7M11 1 7 5M1 11l4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="pbody" style="overflow:hidden;position:relative">
          <svg id="map" viewBox="0 0 960 420" preserveAspectRatio="none" role="img" aria-label="Live map of connections between agents and remote hosts">
            <defs>
              <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
                <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <g id="gLinks" fill="none"></g>
            <g id="gPackets"></g>
            <g id="gNodes"></g>
          </svg>
        </div>
      </section>
      <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" title="Drag to resize the map"></div>

      <section class="panel" style="position:relative">
        <div class="streamhead">
          <div class="row1">
            <div class="ctl" role="group" aria-label="Stream mode">
              <button id="modeLive" aria-pressed="true">Live</button>
              <button id="modeHist" aria-pressed="false">History</button>
            </div>
            <div class="search">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="5" cy="5" r="3.6" stroke="#657486" stroke-width="1.2"/><path d="M7.8 7.8 10.5 10.5" stroke="#657486" stroke-width="1.2" stroke-linecap="round"/></svg>
              <input id="q" type="search" placeholder="Search commands, hosts, tools, session IDs, rules…   /" autocomplete="off">
            </div>
            <span class="count" id="streamCount">0</span>
          </div>
          <div class="chips" id="chips"></div>
        </div>
        <div class="newpill" id="newPill" role="status">0 new events — jump to live</div>
        <div class="pbody" id="stream"></div>
      </section>
    </div>

    <!-- RIGHT -->
    <div class="col">
      <section class="panel" style="flex:1 1 55%;min-height:0">
        <div class="phead">
          <h2>Alerts</h2><span class="count" id="alertCount">0</span>
          <div class="spacer"></div>
          <button class="chip" id="clearAlerts">Clear</button>
        </div>
        <div class="pbody" id="alertList"></div>
      </section>
      <section class="panel" style="flex:1 1 45%;min-height:0">
        <div class="phead"><h2>Hosts contacted</h2><span class="count" id="hostCount">0</span></div>
        <div class="pbody" id="hostList"></div>
      </section>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Detail">
  <div class="dhead">
    <div style="flex:1;min-width:0">
      <h3 id="dTitle">Detail</h3>
      <p id="dSub"></p>
    </div>
    <button class="btn" id="dClose" aria-label="Close detail">Close</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
